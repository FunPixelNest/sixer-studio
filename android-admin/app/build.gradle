plugins { id 'com.android.application' }

def ks = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ks.exists()) ks.withInputStream { ksProps.load(it) }

android {
    namespace 'com.funpixelnest.sixeradmin'
    compileSdk 35
    defaultConfig {
        applicationId 'com.funpixelnest.sixeradmin'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        // Change this if the website moves
        buildConfigField 'String', 'ADMIN_URL', '"https://funpixelnest.github.io/sixer-studio/admin.html"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (ks.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
